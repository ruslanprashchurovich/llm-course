# Прокси + Ollama одним компоузом (урок 5.7).
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:3b
#   curl -H "X-API-Token: dev-token" -X POST http://127.0.0.1:8005/generate \
#        -H "Content-Type: application/json" -d '{"prompt":"привет"}'
#
# ВНИМАНИЕ: в уроке этот compose не прогонялся (сборка образа — долгая);
# файл — рабочая заготовка для самостоятельной проверки.

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=128
    volumes:
      - ollama_models:/root/.ollama
    # Порт наружу НЕ публикуем: к Ollama ходит только прокси по внутренней сети
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12g

  proxy:
    build: .
    environment:
      - OLLAMA_URL=http://ollama:11434   # имя сервиса вместо 127.0.0.1
      - PROXY_MODEL=qwen2.5:3b
      # Практика 5.7: запасная модель и лимит на токен (см. README прокси)
      # - PROXY_FALLBACK_MODEL=qwen2.5:1.5b   # docker compose exec ollama ollama pull qwen2.5:1.5b
      # - PROXY_RATE_LIMIT_PER_MIN=60
      - PROXY_TOKENS=dev-token           # в бою — свои токены и секрет-хранилище
      - PROXY_NUM_PREDICT_CAP=512
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
